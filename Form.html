<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" .css />
    <script src="/js/form.js" defer></script>
    <script src="/characterCounter.js" defer></script>
  </head>
  <body>
    <header><h1 class="app-title">Quizzler App</h1></header>
    <main data-js="container">
      <section class="form-section">
        <label for="question-text-box" class="form-text">Your Questions:</label>
        <textarea
          name="question-text-box"
          class="form-section-content"
          id="question-text-box"
          rows="5"
          cols="45"
          data-js="question-input"
          placeholder="Please write your question"
          data-js="question-input"
          maxlength="150"
          required
        ></textarea>
        <i class="characters-space form-section-content" data-js="question-counter" >150 Characters left</i>
        <label for="answer-text-box">Your Answer:</label>
        <textarea
          name="answer-text-box"
          class="form-section-content"
          id="answer-text-box"
          rows="5"
          cols="45"
          data-js="answer-input"
          placeholder="Please write your answers"
          required
          
          
        ></textarea>
        <i class="characters-space form-section-content" data-js="answer-counter">150 Characters left</i>
        <label for="tag-text-box">Tags:</label>
        <input
        type="text"
          name="tag-text-box"
          class="form-section-content"
          data-js="tag-input"
          placeholder="Please write your tag"
          required
        
        />
        <button type="submit" class="form-section-content" data-js="submit-button">Submit</button>
      </section>
    </main>
    <footer>
      <section class="nav-box">
        <button class="home-button">
          <a href="/index.html"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-house-icon lucide-house"
            >
              <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
              <path
                d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
              />
            </svg>
          </a>
        </button>
        <button class="bookmark-button">
          <a href="/Bookmark-section.html"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-bookmark-plus-icon lucide-bookmark-plus"
            >
              <path d="M12 7v6" />
              <path d="M15 10H9" />
              <path
                d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"
              />
            </svg>
          </a>
        </button>
        <button class="bookmark-button">
          <a href="/Form.html"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-square-plus-icon lucide-square-plus"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M8 12h8" />
              <path d="M12 8v8" />
            </svg>
          </a>
        </button>
        <button class="profile-button">
          <a href="/Profile.html"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-circle-user-icon lucide-circle-user"
            >
              <circle cx="12" cy="12" r="10" />
              <circle cx="12" cy="10" r="3" />
              <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662" />
            </svg>
          </a>
        </button>
      </section>
    </footer>
  </body>
</html>
